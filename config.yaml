  # GitHub allows up to 100 results per page.
  page_size: 100

  # Do not go beyond GitHub's 1000-result search window.
  max_pages_per_query: 10

  sort: stars
  order: desc

  # Large discovery limit.
  max_repositories: 50000

  timeout_seconds: 30
  max_retries: 5
  retry_backoff_seconds: 3


repository_filter:
  # Include small repositories to increase dataset diversity.
  min_stars: 1

  # Maximum repository size = 1 GiB.
  max_size_bytes: 1073741824

  require_license: true

  allowed_licenses:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause

  exclude_archived: true
  exclude_forks: true


file_filter:
  extensions:
    - .py

  # Maximum individual file size = 1 GiB.
  max_file_size_bytes: 1073741824

  min_code_characters: 80
  min_code_lines: 5
  min_tokens: 20

  # Avoid extremely large individual samples.
  max_code_characters: 500000

  ignore_directories:
    - .git
    - .venv
    - venv
    - env
    - __pycache__
    - node_modules
    - dist
    - build
    - .tox
    - .mypy_cache
    - .pytest_cache
    - vendor
    - vendored
    - third_party
    - generated
    - gen


quality:
  syntax_check: true

  reject_generated_code: true

  generated_markers:
    - "generated by"
    - "automatically generated"
    - "do not edit"
    - "this file was generated"

  reject_binary: true

  max_repeated_line_ratio: 0.35


security:
  enabled: true
  reject_on_detection: true


deduplication:
  exact: true
  structural: true


sampling:
  strategy: stratified

  # Maximum repositories to process in one run.
  repositories_per_run: 10000

  # Keep a large candidate pool so the sampler has
  # enough repositories to choose from.
  candidate_pool_size: 30000

  seed: 42

  # Skip repositories successfully crawled in previous runs.
  avoid_previously_crawled: true

  star_buckets:
    - name: very_high
      min_stars: 10000
      max_stars: null
      weight: 0.10

    - name: high
      min_stars: 2000
      max_stars: 9999
      weight: 0.20

    - name: medium
      min_stars: 500
      max_stars: 1999
      weight: 0.25

    - name: low
      min_stars: 100
      max_stars: 499
      weight: 0.25

    - name: very_low
      min_stars: 1
      max_stars: 99
      weight: 0.20


output:
  # Keep adding to the existing dataset.
  mode: append

  train_file: data/train.jsonl
  validation_file: data/validation.jsonl
  metadata_file: data/manifest.jsonl
  state_file: run/state.sqlite3

  # Maximum combined train + validation size = 50 GiB.
  max_dataset_size_bytes: 53687091200

  validation_ratio: 0.10
  split_seed: 42

  include_metadata_in_dataset: false


runtime:
  work_dir: run
  log_level: INFO

  # Continue even if one repository fails.
  continue_on_repository_error: true

  # 0 = unlimited.
  max_files_per_repository: 0

  # 0 = unlimited.
  max_output_records: 0
