# GitHub Python Code Crawler
#
# The crawler uses these settings to define the candidate population,
# sample diverse repositories, process code, and build a JSONL dataset.
# Normal runs do not require Python source changes.

github:
  token_env: GITHUB_TOKEN
  api_base_url: https://api.github.com
  api_version: "2026-03-10"
  download_method: archive
  archive_format: zip


  # Multiple queries create a broader candidate population.
  # Repositories returned by multiple queries are merged by full_name.
  queries:
    - name: general
      query: "language:python stars:>=100 archived:false fork:false"
      weight: 0.45

    - name: machine_learning
      query: "language:python topic:machine-learning stars:>=100 archived:false fork:false"
      weight: 0.15

    - name: data_science
      query: "language:python topic:data-science stars:>=100 archived:false fork:false"
      weight: 0.10

    - name: web
      query: "language:python topic:web stars:>=100 archived:false fork:false"
      weight: 0.10

    - name: automation
      query: "language:python topic:automation stars:>=100 archived:false fork:false"
      weight: 0.10

    - name: scientific
      query: "language:python topic:scientific-computing stars:>=100 archived:false fork:false"
      weight: 0.10

  # Candidate pool controls discovery. The sampler then chooses the smaller
  # repositories_per_run set from this pool.
  sort: stars
  order: desc
  max_repositories: 300
  page_size: 100
  max_pages_per_query: 3

  timeout_seconds: 30
  max_retries: 4
  retry_backoff_seconds: 2

repository_filter:
  min_stars: 100
  # ⭐ MAIN CONFIG: maximum repository size in BYTES.
  # GitHub reports repository size in KB internally; the crawler converts
  # the API value to bytes before comparing.
  #
  # Binary reference:
  # 1 MB  = 1,048,576 bytes
  # 100 MB = 104,857,600 bytes
  # 500 MB = 524,288,000 bytes
  # 1 GB  = 1,073,741,824 bytes
  #
  max_size_bytes: 524288000
  require_license: true
  allowed_licenses:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
  exclude_archived: true
  exclude_forks: true

file_filter:
  extensions:
    - .py
  # ⭐ MAIN CONFIG: maximum size of ONE Python file in BYTES.
  #
  # Binary reference:
  # 1 MB  = 1,048,576 bytes
  # 10 MB = 10,485,760 bytes
  # 100 MB = 104,857,600 bytes
  # 1 GB  = 1,073,741,824 bytes
  #
  max_file_size_bytes: 1048576
  min_code_characters: 80
  min_code_lines: 5
  min_tokens: 20
  max_code_characters: 500000
  ignore_directories:
    - .git
    - .venv
    - venv
    - env
    - __pycache__
    - node_modules
    - dist
    - build
    - .tox
    - .mypy_cache
    - .pytest_cache
    - vendor
    - vendored
    - third_party
    - generated
    - gen

quality:
  syntax_check: true
  reject_generated_code: true
  generated_markers:
    - "generated by"
    - "automatically generated"
    - "do not edit"
    - "this file was generated"
  reject_binary: true
  max_repeated_line_ratio: 0.35

security:
  enabled: true
  reject_on_detection: true

deduplication:
  exact: true
  structural: true

sampling:
  # top      = highest-star repositories first
  # random   = random from candidate pool
  # stratified = random across query groups and star bands
  strategy: stratified
  repositories_per_run: 100
  candidate_pool_size: 1500
  seed: 42
  avoid_previously_crawled: true

  # Weights are normalized automatically.
  star_buckets:
    - name: very_high
      min_stars: 10000
      max_stars: null
      weight: 0.10
    - name: high
      min_stars: 2000
      max_stars: 9999
      weight: 0.20
    - name: medium
      min_stars: 500
      max_stars: 1999
      weight: 0.30
    - name: low
      min_stars: 100
      max_stars: 499
      weight: 0.40

output:
  # append = preserve previous dataset and use persistent state to avoid
  # re-crawling previously completed repositories / code hashes.
  # overwrite = clear dataset and state, then build from scratch.
  mode: overwrite
  train_file: data/train.jsonl
  validation_file: data/validation.jsonl
  metadata_file: data/manifest.jsonl
  state_file: run/state.sqlite3

  # ⭐⭐⭐ MAIN STORAGE CONFIG: maximum combined size of
  # train.jsonl + validation.jsonl in BYTES.
  # The manifest file is NOT included in this limit.
  # 0 = unlimited.
  #
  # Reference (binary units):
  # 1 GB  = 1,073,741,824 bytes
  # 5 GB  = 5,368,709,120 bytes
  # 10 GB = 10,737,418,240 bytes
  # 20 GB = 21,474,836,480 bytes
  #
  max_dataset_size_bytes: 10737418240

  validation_ratio: 0.10
  split_seed: 42
  include_metadata_in_dataset: false

runtime:
  work_dir: run
  log_level: INFO
  continue_on_repository_error: true
  max_files_per_repository: 0   # 0 = unlimited
  max_output_records: 0         # 0 = unlimited
