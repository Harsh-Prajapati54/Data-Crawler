[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-code-crawler"
version = "0.2.0"
description = "Config-driven, diverse GitHub Python code crawler and LLM dataset builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "detect-secrets>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
github-code-crawler = "github_code_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
